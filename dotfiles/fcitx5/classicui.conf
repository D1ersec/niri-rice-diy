# fcitx5 候选窗（classicui）——dotfiles 层的模板
# 部署方式：复制到 ~/.config/fcitx5/conf/classicui.conf（fcitx5 会自己改写该文件，
# 所以仓库这份只作模板，不做符号链接）。
# UseDarkTheme=True 是必须的：niri 会话里 portal 查不到 appearance/color-scheme，
# fcitx5 否则会退回浅色 default。
Vertical Candidate List=False
WheelForPaging=True
TrayOutlineColor=#000000
TrayTextColor=#ffffff
PreferTextIcon=False
ShowLayoutNameInIcon=True
UseInputMethodLanguageToDisplayText=True
Theme=rice-macos
DarkTheme=rice-macos
LightTheme=rice-macos
UseDarkTheme=True
UseAccentColor=True
PerScreenDPI=True
