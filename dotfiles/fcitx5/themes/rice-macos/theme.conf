# Rice macOS —— 候选窗主题（dotfiles 层，不属于 fork 核心）
# 形：大圆角 + 宽留白 + 1px 高光描边；色：中性灰面板 + 蓝色高亮。
# 面板刻意做成不透明：niri 不支持输入法弹出窗的背景模糊（见 ADR 0002 的边界），
# 半透明只会露出锐利背景，比纯色更脏。
[Metadata]
Name=Rice macOS
Version=1.0
Author=NiriRiceDIY
Description=macOS 风格候选窗：不透明中性灰、大圆角、宽留白、蓝色高亮
ScaleWithDPI=True

[InputPanel]
Font=Noto Sans CJK SC 13
Spacing=4

# 未选中候选字
NormalColor=#f5f5f7
# 选中候选字（在蓝色高亮块上）
HighlightCandidateColor=#ffffff
# 已上屏输入的字符
HighlightColor=#0a84ff
HighlightBackgroundColor=#0a84ff

[InputPanel/TextMargin]
Left=16
Right=16
Top=10
Bottom=10

[InputPanel/Background]
Color=#1c1c1e
Image=panel.svg
BorderColor=#ffffff14
BorderWidth=1

[InputPanel/Background/Margin]
Left=12
Right=12
Top=12
Bottom=12

[InputPanel/Highlight]
Color=#0a84ff
Image=highlight.svg

[InputPanel/Highlight/Margin]
Left=16
Right=16
Top=10
Bottom=10

[Menu]
Font=Noto Sans CJK SC 11
NormalColor=#f5f5f7
Spacing=4

[Menu/Background]
Color=#1c1c1e
BorderColor=#ffffff14
BorderWidth=1

[Menu/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

[Menu/Highlight]
Color=#0a84ff

[Menu/Highlight/Margin]
Left=8
Right=8
Top=5
Bottom=5

[Menu/Separator]
Color=#3a3a3c

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=6
Right=6
Top=5
Bottom=5
